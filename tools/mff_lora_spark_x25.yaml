# Native-template LoRA SFT: Spark-X2.5-4B.
# Set model_name_or_path to the mounted Spark base-model directory before run.
model_name_or_path: /models/hch/Spark-X2.5-4B
trust_remote_code: true
train_file: /home/huachenghao/codes/Agent_MFF_Early_Warning/data/sft/train.jsonl
eval_file: /home/huachenghao/codes/Agent_MFF_Early_Warning/data/sft/val.jsonl
output_dir: /home/huachenghao/codes/Agent_MFF_Early_Warning/saves/mff-lora-spark-x25-4b
enable_thinking: false
cutoff_len: 4096
per_device_train_batch_size: 1
per_device_eval_batch_size: 2
gradient_accumulation_steps: 16
num_train_epochs: 3.0
learning_rate: 1.0e-4
lr_scheduler_type: cosine
warmup_ratio: 0.1
weight_decay: 0.0
bf16: true
gradient_checkpointing: true
optim: paged_adamw_8bit
logging_steps: 10
save_steps: 200
eval_steps: 200
save_total_limit: 3
dataloader_num_workers: 4
seed: 42
lora_rank: 32
lora_alpha: 64
lora_dropout: 0.05
# Spark remote code exposes q_k_v_proj/g_proj/out_proj and MLP projections.
target_modules: all-linear
